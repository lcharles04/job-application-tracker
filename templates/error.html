{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  {% if detail %}<pre class="detail">{{ detail }}</pre>{% endif %}
  <a class="btn" href="{{ url_for('dashboard') }}">Back to Dashboard</a>
</div>
{% endblock %}
