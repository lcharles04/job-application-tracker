{% extends "base.html" %}
{% block title %}Delete {{ kind }}{% endblock %}
{% block content %}
<div class="card narrow danger-card">
  <h1>Delete this {{ kind }}?</h1>
  <p class="lead"><strong>{{ name }}</strong></p>
  {% if warnings %}
    <div class="flash flash-error">
      This will also permanently delete {{ warnings | join(', ') }} linked to it.
    </div>
  {% endif %}
  <p>This cannot be undone.</p>
  <form method="post" class="actions">
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{{ cancel_url }}" class="btn btn-ghost">Cancel</a>
  </form>
</div>
{% endblock %}
